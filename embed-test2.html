<body>
    <h1>Tareeqa 2: AIChat.init() function</h1>
    <p>Script load hoti hai, phir page khud function se chatbot start karta hai.</p>

    <script src="chatbot.js?v=5" data-auto="false"></script>
    <script>
        AIChat.init({
            agent: "Eric",
            color: "#7c3aed",
            poweredBy: "codrammer.com",

            prompt: "You are a friendly assistant for this website. Help visitors with their questions about our services."
        });
    </script>
